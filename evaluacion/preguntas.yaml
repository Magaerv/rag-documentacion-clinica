# Conjunto de evaluación, escrito contra el corpus real.
#
#   respondible: true   → la respuesta está en el corpus. Mide cobertura.
#   respondible: false  → la respuesta NO está. Mide si el sistema inventa.
#   documento_esperado  → verifica que la recuperación traiga el documento
#                         correcto, no uno parecido.
#
# Las no respondibles están escritas a propósito con el vocabulario del
# corpus: aranceles, turnos, resultados, cobertura. Una pregunta absurda no
# prueba nada, porque el sistema se abstiene por lejanía semántica y no por
# criterio. Las que revelan defectos son las que suenan como si la respuesta
# tuviera que estar.

casos:
  # ---- Respondibles -------------------------------------------------------

  - pregunta: "¿Cuántas horas de ayuno necesita un adulto para una extracción de sangre?"
    respondible: true
    respuesta_contiene: ["12"]
