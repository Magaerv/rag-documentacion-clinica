  # =========================================================================
  # PREGUNTAS DE ESTRÉS — diseñadas para exigirle a cada mecanismo lo suyo
  #
  # El primer experimento comparativo dio empate entre búsqueda híbrida y
  # búsqueda por significado: los tres modos contra el techo. Un empate en el
  # techo no prueba que sean equivalentes; prueba que la evaluación no
  # discrimina.
  #
  # Estos dos grupos existen para darle poder al experimento:
  #
  #   grupo: parafrasis → la pregunta evita deliberadamente las palabras del
  #     documento. La búsqueda por término exacto no tiene de dónde agarrarse;
  #     la búsqueda por significado debería resolverlas.
  #
  #   grupo: termino → la pregunta usa un término técnico infrecuente que
  #     aparece textual en un solo fragmento. Es donde la búsqueda por término
  #     exacto debería lucirse y donde el vector puede confundirlo con vecinos.
  #
  # Si cada mecanismo falla donde se espera que falle, la híbrida se justifica.
  # Si ninguno falla, la complejidad no se justifica a esta escala.
  # =========================================================================

  # ---- Paráfrasis: sin las palabras del documento -------------------------

  - pregunta: "¿Cuántas horas antes tiene que dejar de comer un adulto?"
    respondible: true
    respuesta_contiene: ["12"]
    documento_esperado: "laboratorio-extracciones.md"
    grupo: parafrasis

  - pregunta: "¿Puedo pedir que otro profesional revise mi caso?"
    respondible: true
    respuesta_contiene: ["segunda opinion"]
    documento_esperado: "derechos-atencion-y-trato.md"
    grupo: parafrasis

  - pregunta: "¿Qué pasa si prefiero no enterarme de mi diagnóstico?"
    respondible: true
    respuesta_contiene: ["rechazar", "no recibir", "prefiera no conocer"]
    documento_esperado: "derecho-a-la-informacion.md"
    grupo: parafrasis

  - pregunta: "¿Cuánto tardan en darme una copia de mis registros médicos?"
    respondible: true
    respuesta_contiene: ["48"]
    documento_esperado: "historia-clinica.md"
    grupo: parafrasis

  # ---- Término exacto: vocabulario técnico infrecuente --------------------

  - pregunta: "¿En qué caso corresponde el hábeas data?"
